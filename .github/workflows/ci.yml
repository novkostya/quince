name: ci

# The same gate ladder as local dev — CI calls only `make` targets (no logic here), and
# every gate runs inside the pinned toolchain containers the Makefile builds from
# deploy/Dockerfile. Running from a fresh checkout is what independently proves the
# fresh-clone property (qn.0 gate). Toolchain versions are pinned in versions.env.
#
# SCOPE is a GIT RANGE and nothing else. The Makefile is handed `origin/main...HEAD` and
# decides, in bin/gate-scope, which gates a change can actually affect; absent SCOPE it runs
# everything, which is what every local invocation still does. Nothing forge-shaped enters the
# Makefile — a Forgejo workflow would pass the same string.
#
# `fetch-depth: 0` is REQUIRED, not tidiness. Measured on run 30423722740: the default
# checkout is `--depth=1` fetching one ref, `+<sha>:refs/remotes/pull/N/merge`, so
# `origin/main` does not exist and the range cannot resolve. gate-scope fails safe there —
# it runs every gate and says why — so getting this wrong costs the saving, never coverage.
#
# THE ONE CONDITIONAL, and it is a VALUE rather than a decision. Three events reach this
# workflow and only one of them has a base to diff against:
#
#   pull_request   SCOPE=origin/main...HEAD — the PR's own diff; gates it cannot affect decline
#   push (main)    SCOPE='' — there is no base, and an empty range read as "nothing changed"
#                  would skip every gate on the run that proves main is green
#   merge_group    SCOPE='' — same reason and a stronger one: this is the run that decides
#                  whether a queued batch enters main, so it runs the FULL ladder on the
#                  merged result while the PRs that fed it stayed scoped and fast
#
# `github.event_name` is only ever compared to 'pull_request', so both SCOPE='' cases fall out
# of the `||` without naming themselves — which is why they are named here. Same justification
# as pr-title.yml's `${{ github.repository }}`: forge-set, constrained, not contributor-controlled.

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SCOPE: ${{ github.event_name == 'pull_request' && 'origin/main...HEAD' || '' }}

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Docker (with buildkit) is preinstalled on ubuntu-latest; the Makefile autodetects
      # it and runs each gate in its toolchain container. No language setup needed.
      - name: Gate ladder
        run: make gates SCOPE="$SCOPE"

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Build production image (no push)
        run: make image SCOPE="$SCOPE"

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Builds the image, boots `quince serve --demo`, and runs the Playwright stories
      # (stories 1-2) in the official Playwright container against it.
      - name: Playwright e2e (demo mode)
        run: make gates-ui-e2e SCOPE="$SCOPE"
