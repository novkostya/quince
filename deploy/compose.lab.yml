# quince — lab deployment (Proxmox LXC on the same LAN as the test iPhone).
#
# This is the HARDENED / external-muxer shape: usbmuxd runs on the HOST and quince consumes its
# socket (bound in below). That is the ONLY shape v0.1 has — quince ships no muxer daemon — so
# there is nothing to turn off: every `muxers:` entry is external by default, and `type: managed`
# is refused at startup.
#
# The socket is bound at /var/run/usbmuxd, which is libusbmuxd's own default AND quince's, so
# THIS DEPLOYMENT NEEDS NO MUXER CONFIG AT ALL. The UI Rescan button is a no-op (409) — quince
# does not own the host muxer.
#
# A Wi-Fi muxer is a SECOND ENTRY rather than a second key:
#
#   muxers:
#     - address: /var/run/usbmuxd     # the host usbmuxd, bound in below
#     - address: 127.0.0.1:27015      # a host-run netmuxd
#
# One muxer serving BOTH transports is ONE entry — netmuxd does exactly that, and the old shape
# made you write its address twice. A host-run netmuxd also sidesteps the container-mDNS
# constraint described in compose.nas.yml, since it is already on the LAN. Remember it must not be
# started with the DEFAULT --socket-path: it deletes and rebinds whatever socket that names, which
# on this host is the live usbmuxd's (verified, qn.4c). Give it
# `--socket-path /var/run/netmuxd --disable-usb`.
#
# A `devices:` section is REFUSED at startup, by name, with the replacement printed — it is not
# ignored. For the SIMPLE in-container managed-muxer profile, see compose.nas.yml (descoped).
# The backup path is bind-mounted; storage-backend probing happens at runtime (D5).

services:
  quince:
    image: ghcr.io/novkostya/quince:latest
    container_name: quince
    restart: unless-stopped
    ports:
      - "8968:8968"
    environment:
      QUINCE_LISTEN: ":8968"
      # QUINCE_DATA / QUINCE_CACHE default to /data /cache. Backup roots are NOT env:
      # qn.6c retired QUINCE_BACKUPS — declare storages under `storage:` in config.yml (a list).
    volumes:
      - ./data:/data # app DB, config.yml, pairing records (persistent)
      - ./cache:/cache # session scratch + derived caches (disposable)
      # Backup storage. On this host: a zfs child-dataset parent (D5). Use rbind,rslave
      # so datasets created later appear live in the container (design §5 PVE note).
      - /rpool/userdata/iphone-backup:/backups
      # USB path: share the host usbmuxd socket (host runs usbmuxd; device on USB).
      - /var/run/usbmuxd:/var/run/usbmuxd
    devices:
      # Raw USB bus for pairing/first backup. Narrow this to the specific bus/device in
      # production; broad here for the lab. (qn.2 verifies device visibility.)
      - /dev/bus/usb:/dev/bus/usb
