# quince — self-hosted iPhone & iPad backups.
#
# Check one thing first: does this machine already run usbmuxd?
#
#   ss -lx | grep usbmux
#
#   nothing      →  this is the right file, carry on
#   something    →  use compose.host-muxer.yml instead. Two muxers fight over the USB bus.
#
# Then:
#
#   1. Save this file as compose.yml
#   2. docker compose up -d
#   3. Open http://<this-host>:8968
#
# Change the backups path, marked below. You will also need HTTPS before you can sign in from
# your phone — the commented-out certificate line below is one way to get it.
#
# Two containers. quince does not talk to iPhones itself; netmuxd does, over USB and over Wi-Fi,
# and quince connects to it.

services:
  # ── netmuxd: finds devices and carries their traffic ────────────────────────────────────────
  muxer:
    # Pinned by digest because upstream publishes no version tags — a tag here would move under
    # you, and the workarounds below are specific to this build.
    image: ghcr.io/jkcoxson/netmuxd@sha256:32cb00e05410896d485e4482f5f73e715f400209dc85555e7678315518c9dbc5
    container_name: quince-muxer
    restart: unless-stopped

    # Wi-Fi devices announce themselves over mDNS, which does not cross a container bridge. This
    # is why the muxer gets the host network and quince does not. A macvlan network should work too,
    # if you would rather not share the host's — it gives this container its own address on your LAN.
    network_mode: host

    # Permission to open USB devices. Full `privileged: true` is the usual advice and is not
    # needed here.
    device_cgroup_rules:
      - "c 189:* rmw"

    environment:
      RUST_LOG: info # otherwise it logs nothing, and "my device never showed up" is what you will want a log for

    command: ["--socket-path", "/var/run/usbmuxd", "--plist-storage", "/var/lib/lockdown"]

    volumes:
      # A bind mount, not `devices:`. `devices:` fixes the list of USB devices at startup, so a
      # phone plugged in later never appears inside the container.
      - /dev/bus/usb:/dev/bus/usb

      # Where the socket to quince is created. /run is memory-backed, so nothing survives a reboot.
      - /run/netmuxd:/run

      # Pairing records. quince creates them; the muxer only reads them.
      - ./quince/data/lockdown:/var/lib/lockdown:ro

      # This host has an identity file in that same directory, and netmuxd reads everything there
      # as though it were a phone. Left visible, it shadows the real device and Wi-Fi silently
      # stops working. Masking it with an empty file is the fix — do not remove this line.
      - /dev/null:/var/lib/lockdown/SystemConfiguration.plist

  # ── quince ──────────────────────────────────────────────────────────────────────────────────
  quince:
    # Pinned on purpose: quince is pre-release, so there is no `latest` tag to follow.
    # Override with QUINCE_VERSION to try another one.
    image: ghcr.io/novkostya/quince:${QUINCE_VERSION:-0.1.0-alpha.2}
    container_name: quince
    restart: unless-stopped
    depends_on: [muxer]
    ports:
      - "8968:8968" # change the left side if something else already uses this port
    volumes:
      - ./quince/data:/data # config, database, quince's own state — keep this
      - ./quince/cache:/cache # scratch, safe to delete

      # ▸ Your backups go here. Point the left side at real storage — a NAS share, a ZFS
      #   dataset, a big disk. A full iPhone backup can run to tens of gigabytes.
      - ./quince/backups:/backups

      # There is deliberately no /var/lib/lockdown here. Pairing records belong to the muxer and
      # quince asks it for them — binding quince's own data directory there as well would make one
      # directory answer to two names, and the copy between them empties the file.

      - /run/netmuxd:/run/mux:ro # the muxer's socket; quince only reads it

      # HTTPS — you will need it. Browsers drop the login cookie over plain http, so you would be
      # able to sign in from this machine and from nowhere else. Either put a reverse proxy with a
      # certificate in front of quince, or drop a certificate into ./quince/certs and uncomment the
      # line below — quince finds it and walks you through the rest. More in deploy/tls.md.
      # - ./quince/certs:/certs:ro

# ── Configuration ─────────────────────────────────────────────────────────────────────────────
# There is none to write. quince starts on defaults and asks for a storage location the first
# time you open it; everything else is editable in the web UI, and lands in config.yml under
# ./quince/data.
