# quince — the HARDENED profile, and the only one v0.1 ships (qn.6p).
#
# quince runs NO muxer. You run one; quince dials it. This file runs one for you in a sidecar, but
# a muxer already on your host works just as well — see "If you already run a muxer" below, which
# is the case this profile exists for.
#
# ── Why two containers, when one used to do ────────────────────────────────────────────────────
# Wi-Fi devices are found by mDNS, which is link-local: whatever does the finding has to be ON the
# LAN. Until qn.6p the muxer lived inside quince's container, so THAT container needed host
# networking — and `compose.nas.yml` says so about itself, calling it "strictly weaker isolation
# than the bridged default, and at odds with the hardened-profile story".
#
# Splitting them does not rebalance that trade, it removes it. The MUXER takes host networking;
# quince stays bridged, unprivileged, with no access to /dev/bus/usb at all. The device traffic
# reaches quince over a unix socket in a shared volume.
#
# ── Why a unix socket and not a TCP port ───────────────────────────────────────────────────────
# A unix socket is a filesystem object, so it crosses network namespaces because the VOLUME does.
# A TCP port cannot: `127.0.0.1:27015` in the host namespace is unreachable from a bridged
# container, and the alternative — binding the host's LAN address — puts an UNAUTHENTICATED muxer
# on your network. A muxer has no password in front of it; anything that reaches it can talk to
# every device it serves.
#
# quince accepts a TCP address too (`host:port`), and that is the right answer if the muxer you
# already run listens on one. It is simply not what this file should demonstrate.

services:
  # ── The muxer ────────────────────────────────────────────────────────────────────────────────
  # netmuxd serves BOTH transports over one socket: USB, and Wi-Fi devices found over mDNS.
  #
  # PINNED BY DIGEST, not by tag. Upstream publishes `latest`, `master` and `sha-<commit>` and no
  # version tags at all, so a tag would move under you — and the traps below are version-specific.
  # This digest is `sha-ac8da97`, published 2026-08-10, read from the registry at pin time.
  muxer:
    image: ghcr.io/jkcoxson/netmuxd@sha256:32cb00e05410896d485e4482f5f73e715f400209dc85555e7678315518c9dbc5
    container_name: quince-muxer
    restart: unless-stopped

    # HOST NETWORK IS REQUIRED, and this is the container that needs it — not quince. mDNS is
    # multicast on the local link, and a bridged container is on a different link.
    network_mode: host

    # USB: the bind exposes the device nodes, the cgroup rule permits opening them (189 is the USB
    # major). This is the whole requirement — `privileged: true` is the usual advice and grants far
    # more than this needs.
    #
    # A LIVE BIND, NOT `devices:`. `devices:` snapshots the node list at container start, so a
    # device plugged in later never appears inside the container.
    device_cgroup_rules:
      - "c 189:* rmw"
    volumes:
      - /dev/bus/usb:/dev/bus/usb

      # The socket quince dials. A named volume rather than a host path so both containers agree
      # on it without either owning a directory on your disk.
      - mux:/run/mux

      # Pairing records, shared with quince. quince PAIRS, so it holds these read-write; the muxer
      # only needs to read them — it matches a Wi-Fi device's advertisement against the record for
      # that device, and serves nothing it has no record for.
      - ./quince/data/lockdown:/var/lib/lockdown:ro

      # HIDES THIS COMPUTER'S OWN IDENTITY FILE, AND WI-FI DEPENDS ON IT.
      #
      # /var/lib/lockdown holds one file that is not a pairing record — SystemConfiguration.plist,
      # this host's identity — and netmuxd reads every file in that directory as though it were
      # one. A plist with no `UDID` key is indexed under its FILE NAME, so it becomes a device
      # called "SystemConfiguration"; one carrying a `HostID` joins the table Wi-Fi lookups search.
      # A Bonjour advertisement can then match the file instead of the phone, the lookup returns
      # "SystemConfiguration" as the udid, the real record is never tried, and the device is simply
      # unreachable over Wi-Fi.
      #
      # /dev/null is what keeps it out: an empty file fails to parse, and the parse failure is what
      # keeps it out of both tables. A valid-but-EMPTY plist does not work — netmuxd fills in a
      # HostID and writes it back, and the trap closes again.
      #
      # NOT NEEDED AT EVERY VERSION, WHICH IS WHY THE DIGEST IS PINNED. Measured against the
      # v0.4.3 quince used to build in-container: it reads pairing files by UDID on demand and
      # never touches SystemConfiguration.plist. The image above is newer. Removing this mount
      # because "it did not seem to do anything" is how Wi-Fi breaks on the next bump.
      - /dev/null:/var/lib/lockdown/SystemConfiguration.plist

    # --socket-path is the whole configuration: no --host/--port, so netmuxd serves the unix socket
    # and opens no TCP listener. RUST_LOG=info makes its discovery lines visible; it is silent
    # below `error` otherwise, and a device that never appears is the thing you will want a log for.
    environment:
      RUST_LOG: info
    command: ["--socket-path", "/run/mux/usbmuxd", "--plist-storage", "/var/lib/lockdown"]

  # ── quince ───────────────────────────────────────────────────────────────────────────────────
  # Bridged. Unprivileged. No /dev/bus/usb, no device_cgroup_rules, no host networking. It reaches
  # devices only through the socket above, which is the point of this profile.
  quince:
    # ⚠ THIS TAG IS NOT PUBLISHED YET (quince#725, open). `compose up` fails here with a registry
    # 403, and nothing else in this file is wrong when it does. Until the release pipeline lands
    # (quince#724), build it yourself from a checkout — `make image` — and point this line at the
    # local tag it prints. The rest of the file is unaffected either way.
    image: ghcr.io/novkostya/quince:latest
    container_name: quince
    restart: unless-stopped
    depends_on: [muxer]
    ports:
      - "8968:8968"
    environment:
      QUINCE_LISTEN: ":8968"
    volumes:
      - ./quince/data:/data
      - ./quince/cache:/cache
      - ./quince/backups:/backups # point at a real share; backend probed at runtime
      - mux:/run/mux
      # READ-WRITE here: quince is what pairs, so it writes the records the muxer reads. If
      # something else on this box owns them, mount this `:ro` — quince detects that it cannot
      # write, disables Pair with the reason, and goes on reading existing pairings, so a device
      # paired elsewhere is still listed and still backs up (qn.6p D7).
      - ./quince/data/lockdown:/var/lib/lockdown
      # HTTPS: a phone is not loopback, so a plain-http LAN address CANNOT LOG IN — quince answers
      # 426 rather than looping. Put a reverse proxy or `tailscale serve` in front, or mount a
      # certificate and set `tls:` in config.yml. See deploy/tls.md.
      # - ./quince/certs:/certs:ro

volumes:
  mux:

# ── The config this expects ────────────────────────────────────────────────────────────────────
# In ./quince/data/config.yml. BOTH keys point at the SAME socket, which is how you say "one muxer
# serves both transports" — quince opens ONE connection to it, not two:
#
#   devices:
#     usbmuxd_socket: /run/mux/usbmuxd
#     netmuxd_addr: /run/mux/usbmuxd
#
# Either key also accepts `UNIX:/run/mux/usbmuxd` and `host:port`. `manage_muxer` is absent on
# purpose: it defaults to false, and `true` is refused at startup because v0.1 ships no daemon to
# manage.
#
# ── If you already run a muxer ─────────────────────────────────────────────────────────────────
# Check before starting anything — two muxers fight over the USB bus:
#
#   ss -lx | grep usbmux
#
# Found something? DELETE the `muxer:` service above, drop the `mux` volume, and point quince at
# what you have — bind the host socket in and name it:
#
#   volumes: [/var/run/usbmuxd:/var/run/usbmuxd]
#   devices: { usbmuxd_socket: /var/run/usbmuxd }
#
# That is `usbmuxd`'s own default path, so it is also quince's default and you may not need to
# write the key at all. USB only — a host usbmuxd does not serve Wi-Fi.
#
# ── Not yet proven, stated rather than discovered ──────────────────────────────────────────────
# This file has NOT been run end to end against a device (qn.6p G8, owed to the Operator). What HAS
# been proven: the image builds without a muxer and its CLIs work; quince dials a unix socket for
# either transport; health reports the muxer from the connection it actually holds.
#
# One thing to watch on the first run: what a device served by a single dual-transport muxer
# reports as its TRANSPORT is an open question (quince#897 item 4). It does not affect whether a
# backup runs; it affects the badge and, later, `backup.preferred_transport`.
