# quince — generic NAS deployment (Synology / QNAP / plain Docker host).
#
# This is the SIMPLE / managed-muxer profile (qn.2b + qn.4c): quince supervises BOTH muxer
# daemons INSIDE the container itself (devices.manage_muxer: true, the default) — usbmuxd for
# USB, netmuxd for Wi-Fi. No host muxer, no socket bind. `compose up`, open the UI, plug in a
# device. On a typical NAS the storage backend auto-selects `reflink` (Btrfs/XFS) or
# `hardlink`/`copy` (ext4) — no zfs host hook needed (D5).
#
# ── What in this file has been RUN, and what is reasoning ──────────────────────────────────
# A deployment example gives no way to tell a measured instruction from a plausible one, so
# this file says which its own lines are. Read anything not listed here as reasoned.
#
# RUN, once, end to end — Docker CE 29.7.2 on Debian 13, a real iPhone and iPad, 2026-08-14
# (quince#651). Storageless first run -> onboarding -> pair -> a completed, verified, COMMITTED
# backup, unprivileged throughout (`Privileged=false`, `CapAdd=[]`). What that covers:
#   - this file starting at all as written: the service, the volume set, the environment,
#     `restart: unless-stopped` and `container_name`;
#   - both managed muxers coming up inside the container and staying up;
#   - `device_cgroup_rules: c 189:* rmw` carrying a REAL PHONE through usbmuxd, not merely
#     opening a device node (quince#650 left that reasoned for Docker; it no longer is);
#   - the `/dev/bus/usb` VOLUME bind, and pairing over it;
#   - the storage backend probe on a real share, selecting `reflink`;
#   - a SECOND, incremental backup on the same storage: the seed ran, verify passed, the first
#     version was displaced into `versions/<ts>/` intact, and the two versions cost 4.4 G of
#     disk for 7.4 G of apparent tree — the reflink space claim, measured rather than asserted;
#   - BOTH halves of the Wi-Fi paragraph below — bridged really does discover nothing, and
#     `network_mode: host` really does fix it, on this runtime.
#
# NOT run, and not claimed:
#   - Synology and QNAP. That was a plain Docker host, which is one of the three platforms the
#     first line names and not the other two.
#   - nerdctl, podman and unprivileged LXC — the `privileged: true` alternative at the end of
#     the USB paragraph is REASONED for podman and LXC, and quince#650 measured it FALSE for
#     nerdctl. Do not read it as tested.
#   - macvlan, named below as the isolation-preserving alternative. Nobody has built one.
#   - any throughput number. None is offered anywhere in this file.
#   - retention, restore, and browse. One device, two versions, nothing pruned.
#
# `ghcr.io/novkostya/quince:latest` DOES NOT EXIST YET (quince#725), so a literal `compose up`
# of this file fails at the pull. The run above supplied the image through a second file
# (`docker-compose.override.yml`) rather than editing the line, deliberately, so that this
# stays visible rather than papered over. NOTE that `docker-compose.override.yml` is only
# auto-loaded for the DEFAULT file names — with `-f compose.nas.yml` it must be passed as a
# second `-f`, which nothing else here would tell you.
#
# ── Wi-Fi needs the container on the LAN (a first-class deployment constraint) ─────────────
# netmuxd finds Wi-Fi devices ONLY by mDNS (`_apple-mobdev2._tcp.local`). Multicast does not
# cross a bridged container network, so with the default `ports:` mapping below netmuxd runs
# happily and discovers NOTHING — quince will show the muxer as `running` because it IS, while
# Wi-Fi stays empty forever. If Wi-Fi backup matters to you (it is quince's primary use case),
# run the container ON the host network:
#
#   network_mode: host        # and DELETE the `ports:` block — QUINCE_LISTEN binds host :8968
#
# BOTH HALVES OF THIS PARAGRAPH ARE MEASURED (quince#651, 2026-08-14): bridged, a paired device
# backed up over USB and netmuxd discovered nothing over Wi-Fi for as long as it stayed bridged;
# with the two-line edit above, the same device appeared over mDNS within seconds. Applying this
# edit is FOLLOWING this file, not deviating from it.
#
# Honest tradeoff: host networking shares the host's network namespace with the container, so
# the container can reach (and bind) anything the host can — strictly weaker isolation than the
# bridged default, and at odds with the hardened-profile story. The alternative that keeps
# isolation is a **macvlan** network, which gives the container its own LAN presence (and its
# own IP) without host-namespace access; it is more setup and not available on every host.
# USB-only deployments can ignore all of this and stay bridged.
#
# USB needs a LIVE /dev/bus/usb, NOT a static `devices:` mapping. `devices:` (runc --device)
# snapshots the device-node list at container start, so a device plugged in — or re-enumerated —
# LATER never appears inside the container. That defeats the whole point of **Rescan**, which
# restarts the in-container muxer precisely to pick up such a device (an unprivileged container
# receives no USB hotplug events, so a post-startup device is surfaced by clicking Rescan in the
# UI). So bind /dev/bus/usb as a VOLUME (its contents stay live) and grant char-device access:
#   - Docker: the `device_cgroup_rules` below allow major 189 (USB) — no privileged needed.
#   - nerdctl / podman / unprivileged LXC (no device_cgroup_rules support): DROP that block and
#     add `privileged: true` instead — that is how the container opens USB char devices there.

services:
  quince:
    image: ghcr.io/novkostya/quince:latest
    container_name: quince
    restart: unless-stopped
    ports: # DELETE this block when you switch to `network_mode: host` for Wi-Fi (see the header)
      - "8968:8968"
    environment:
      QUINCE_LISTEN: ":8968"
    volumes:
      - ./quince/data:/data
      - ./quince/cache:/cache
      - ./quince/backups:/backups # point at a real share; backend probed at runtime
      # HTTPS: a phone is not loopback, so a plain-http LAN address CANNOT LOG IN — quince
      # answers 426 rather than looping. Either put a reverse proxy or `tailscale serve` in
      # front (nothing to configure here), or mount a certificate and set `tls:` in
      # config.yml — read-only, because quince never writes to it. See deploy/tls.md.
      # - ./quince/certs:/certs:ro
      - /dev/bus/usb:/dev/bus/usb  # LIVE USB bind — NOT `devices:` (that snapshots & defeats Rescan)
    device_cgroup_rules:
      - "c 189:* rmw" # allow opening USB char devices (major 189). nerdctl/LXC: drop this, use `privileged: true`.
