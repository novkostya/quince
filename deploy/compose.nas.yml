# ##############################################################################################
# THIS FILE DOES NOT WORK IN v0.1. USE deploy/compose.hardened.yml.
#
# It describes the SIMPLE / managed-muxer profile, which qn.6p descoped: quince ships no muxer
# daemon, and `type: managed` in `muxers:` — which everything below assumes — is REFUSED at
# startup. Bringing this up gets you a daemon that will not start, not a degraded one.
#
# Kept rather than deleted for now, because the NAS shape is a documented deployment target
# (design §9) and the storage guidance below is still correct. WHETHER THIS BECOMES A
# NAS-FLAVOURED COPY OF THE HARDENED EXAMPLE OR SIMPLY GOES AWAY IS THE REVIEWER'S CALL — raised
# in the PR that added this banner rather than decided in it, because it is a question about what
# a NAS operator should be handed and the answer is not obvious from the code.
#
# One thing the split already fixed, worth knowing before choosing: the Wi-Fi warning below is now
# the MUXER container's business. quince no longer needs host networking to see Wi-Fi devices, so
# it no longer trades isolation for the primary transport.
# ##############################################################################################
#
# quince — generic NAS deployment (Synology / QNAP / plain Docker host).
#
# This is the SIMPLE / managed-muxer profile (qn.2b + qn.4c): quince supervises BOTH muxer
# daemons INSIDE the container itself (`type: managed`, once it returns) — usbmuxd for
# USB, netmuxd for Wi-Fi. No host muxer, no socket bind. `compose up`, open the UI, plug in a
# device. On a typical NAS the storage backend auto-selects `reflink` (Btrfs/XFS) or
# `hardlink`/`copy` (ext4) — no zfs host hook needed (D5).
#
# ── Wi-Fi needs the container on the LAN (a first-class deployment constraint) ─────────────
# netmuxd finds Wi-Fi devices ONLY by mDNS (`_apple-mobdev2._tcp.local`). Multicast does not
# cross a bridged container network, so with the default `ports:` mapping below netmuxd runs
# happily and discovers NOTHING — quince will show the muxer as `running` because it IS, while
# Wi-Fi stays empty forever. If Wi-Fi backup matters to you (it is quince's primary use case),
# run the container ON the host network:
#
#   network_mode: host        # and DELETE the `ports:` block — QUINCE_LISTEN binds host :8968
#
# Honest tradeoff: host networking shares the host's network namespace with the container, so
# the container can reach (and bind) anything the host can — strictly weaker isolation than the
# bridged default, and at odds with the hardened-profile story. The alternative that keeps
# isolation is a **macvlan** network, which gives the container its own LAN presence (and its
# own IP) without host-namespace access; it is more setup and not available on every host.
# USB-only deployments can ignore all of this and stay bridged.
#
# USB needs a LIVE /dev/bus/usb, NOT a static `devices:` mapping. `devices:` (runc --device)
# snapshots the device-node list at container start, so a device plugged in — or re-enumerated —
# LATER never appears inside the container. That defeats the whole point of **Rescan**, which
# restarts the in-container muxer precisely to pick up such a device (an unprivileged container
# receives no USB hotplug events, so a post-startup device is surfaced by clicking Rescan in the
# UI). So bind /dev/bus/usb as a VOLUME (its contents stay live) and grant char-device access:
#   - Docker: the `device_cgroup_rules` below allow major 189 (USB) — no privileged needed.
#     MEASURED (quince#650): Docker CE 29.7.2 on Debian 13, an iPad and an iPhone paired through
#     the container, with `Privileged: false`, no `cap_add`, and the AppArmor profile and the
#     masked /proc and /sys paths all intact. The cgroup rule and the bind are the whole of it.
#   - nerdctl inside an unprivileged LXC (no device_cgroup_rules support): DROP that block and add
#     NOTHING in its place. MEASURED (quince#650): the live bind alone opens USB char devices.
#     This file required `privileged: true` here and it was never needed — it rode along with the
#     hotplug fix above as reasoning rather than as a result, and nobody removed it to check.
#     It also costs the confinement the Docker line keeps: no AppArmor profile, no masked /proc.
#   - podman, or any other runtime: UNTESTED. Nobody has run quince on one, so this file has no
#     answer to give and will not borrow the nerdctl one. Start from the bind alone; if a device
#     cannot be opened, that is worth an issue rather than a `privileged: true` copied from here.
#
# What is measured on both runtimes is the PERMISSION, which is a smaller claim than it looks:
# usbmuxd runs inside the container, so a paired device means it opened the char device, and a
# device cgroup gates open() rather than anything on the resulting fd. A completed USB backup is
# a separate claim — about transfer reliability, not permission — and neither runtime has one
# recorded here.

services:
  quince:
    image: ghcr.io/novkostya/quince:latest
    container_name: quince
    restart: unless-stopped
    ports: # DELETE this block when you switch to `network_mode: host` for Wi-Fi (see the header)
      - "8968:8968"
    environment:
      QUINCE_LISTEN: ":8968"
    volumes:
      - ./quince/data:/data
      - ./quince/cache:/cache
      - ./quince/backups:/backups # point at a real share; backend probed at runtime
      # HTTPS: a phone is not loopback, so a plain-http LAN address CANNOT LOG IN — quince
      # answers 426 rather than looping. Either put a reverse proxy or `tailscale serve` in
      # front (nothing to configure here), or mount a certificate and set `tls:` in
      # config.yml — read-only, because quince never writes to it. See deploy/tls.md.
      # - ./quince/certs:/certs:ro
      - /dev/bus/usb:/dev/bus/usb  # LIVE USB bind — NOT `devices:` (that snapshots & defeats Rescan)
    device_cgroup_rules:
      - "c 189:* rmw" # allow opening USB char devices (major 189). Docker only — nerdctl drops this block and adds nothing; see the header.
